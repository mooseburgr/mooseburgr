<VirtualHost *:443>
  ServerName nese.community
  ServerAdmin root@nese.community

  SSLEngine on
  SSLCertificateFile    	/etc/letsencrypt/live/nese.community/cert.pem
  SSLCertificateKeyFile 	/etc/letsencrypt/live/nese.community/privkey.pem
  SSLCertificateChainFile 	/etc/letsencrypt/live/nese.community/fullchain.pem

  DocumentRoot /var/www/humhub

  <Directory /var/www/humhub/>
     Options -Indexes -FollowSymLinks
     AllowOverride All
  </Directory>

  <DirectoryMatch "/var/www/humhub/(\.|protected|themes/\w+/views|uploads/file)">
     Order Deny,Allow
     Deny from all
  </DirectoryMatch>

  <FilesMatch "^\.">
     Order Deny,Allow
     Deny from all
  </FilesMatch>
  
  <DirectoryMatch "/var/www/humhub/(static|uploads|themes|assets)">
        Header set Cache-Control "max-age=172800, public"
  </DirectoryMatch>
</VirtualHost>

<VirtualHost *:80>
   ServerName nese.community
   Redirect / https://nese.community
</VirtualHost>
